# powerpack 실기 설정 — 위에서부터 자주 만지는 순서로 정렬돼 있다.
#
#   1 채널 압력 PID      ← 튜닝은 거의 여기
#   2 크래킹 바이어스     밸브 대기 위치
#   3 레일(라인) PID      공급 압력 목표
#   4 안전
#   5 위치·힘 제어        control_mode 1/2 에서만
#   6 채널·보드 매핑, 부피
#   7 센서 보정
#   8 통신·주기           평소 만질 일 없음
#   9 can_bridge 노드     CAN·워치독·엔코더
#
# 압력은 전부 kPa **absolute** (대기압 101.325). 밸브 지령은 % (0=폐쇄, 100=개방).
# 밸브 13-parameter 는 config/valve_params.yaml 에 있다 (런치가 병합).

/pack2/pp_controller:
  ros__parameters:

    # ══ 1. 채널 압력 PID ═══════════════════════════════════════════════════
    # 채널 = 축의 챔버 하나 (축 i → 양압 gid i, 음압 gid 6+i).
    #   e     = ±(P_ref − P_meas)   음압은 부호를 뒤집어 양압과 같은 로직을 쓴다
    #   P(e)  = kp·e (|e| ≤ kp_break_kpa) / kp·brk + kp_far·(|e|−brk) (그 밖)
    #   u > 0 → micro,  u < 0 → atm,  macro 는 항상 0
    #
    # 6단으로 겹쳐 읽는다 (뒤가 앞을 덮어씀, 없는 키는 앞 값 유지):
    #   ChannelPID.*  →  .{up,down}.*  →  .{pos,neg}.*  →  .{pos,neg}.{up,down}.*
    #   →  channel_config.chN.pid.*  →  channel_config.chN.pid.{up,down}.*
    # up = 압력 올리는 방향, down = 내리는 방향. 최종 적용값은 기동 로그에 채널별로 찍힌다.
    ChannelPID:
      # ── 20260910_165626 계단 시험으로 갱신 ───────────────────────────────
      #
      # **지난 회차에서 내가 방향을 거꾸로 잡았다.** +20 계단의 순간 파형만 보고
      # "배기가 충전보다 3.3 배 세다" 고 판단해 하강 게인을 1/3 로 깎았는데,
      # 그 파형은 micro 가 활짝 열려 레일에서 쏟아붓던 과도구간이었다.
      # 이번에 **차압을 공변량으로 넣은 다중회귀**(다른 밸브가 닫힌 구간만,
      # micro n=5944 / atm n=15629)로 다시 재니 정반대다:
      #
      #     충전 micro : 2.89 kPa/s per %p     (차압 계수 +0.560)
      #     배기 atm   : 0.97 kPa/s per %p     (차압 계수 +0.213)
      #     ⇒ **충전이 배기보다 3.0 배 세다.** 하강에 더 큰 게인이 필요하다.
      #
      # 그 오판의 대가가 이번 실행에 그대로 나왔다 (사용자 관측 "130 120 110 으로
      # 내려올 때 특히 느리다"):
      #     Δ=10 상승  63% 0.30 s  오버슛 1.83
      #     Δ=10 하강  63% 2.42 s  오버슛 3.05  말기 −2.20   ← 8 배 느리다
      #
      # 배기가 약한 물리적 이유: atm 밸브의 차압은 챔버−대기다. 챔버 110 이면
      # 8.7 kPa 뿐이다 (챔버 160 이면 58.7). 낮은 압력으로 내려갈수록 배기 여력이
      # 급감한다 — 그래서 gain_scale_max 도 함께 올린다.
      kp: 0.6                # [%/kPa]      정착 구간 이득
      kp_far: 0.6            # [%/kPa]  ← 0.7   큰 계단 오버슛(+20 에서 9.6)을 줄인다
      kp_break_kpa: 3.0      # [kPa]
      ki: 2.0                # [%/(kPa·s)]
      ki_far: 1.0            # ← 0.3. 0.3 은 너무 작아 바이어스를 못 쌓아 굼떴다
      kd: 0.03               # ← 0.0
                             # 실측 잡음으로 안전이 확인됐다: 필터 통과 압력 σ 0.03~0.4 kPa,
                             # 틱당 변화 σ 0.007~0.012, 미분 σ 0.7~1.2 kPa/s →
                             # kd 0.05 에서도 지령 잡음이 0.03~0.06 %p 뿐이다
                             # (추종 신호가 0.2~0.6 %p 이므로 10 % 수준).
                             # 예전에 0 이었던 이유는 옛 센서(0.25 kPa/mV) 의 잡음이다.
                             # 효과(20260910_212143): 양압3축 고주파 잔차 1.94 → 0.25,
                             # 6축 1.53 → 0.51. 채터가 사실상 사라졌다.
      i_limit_pct: 20.0      # ← 8.0 ← 4.0 (그 전 12.0)
                             # 20260914_100318 (2축 정특성): 양압 목표가 128 kPa 을
                             # 넘어가면서 추종오차가 −4.6 kPa 까지 벌어졌다. 원인이
                             # 여기다 — 오차 2 kPa 초과 구간의 **87.6 %** 에서 i_term 이
                             # 정확히 +8.00 에 박혀 있었고 gain_scale 도 이미 상한 2.00
                             # 이라 u_pid 가 11 %p 에서 더 못 올라갔다.
                             # 두 가지가 겹쳤다: (1) 2축은 1축보다 뻣뻣해 같은 각도에
                             # 더 큰 차압이 들어 P+ 를 142 까지 써야 한다, (2) 그만큼
                             # 레일(160)과의 차압이 19 kPa 까지 줄어 같은 개도로 흐르는
                             # 유량이 적다. 1축은 P+ 129 를 안 넘어서 안 걸렸을 뿐이다.
                             # 근본 해결은 레일 상향이고(아래 LinePID.pos.ref 주석),
                             # 여기는 그 전까지 권한을 열어 주는 몫이다.
                             # 20260910_212143: 사이클이 지날수록 두 밸브의 유효개도가
                             # 함께 커진다 (축1 micro 1.22→2.52→3.64, atm 2.33→3.39→4.65).
                             # |u_pid| 95% 가 3.3 → 5.3 으로 상한 4 를 넘어, 적분이 포화한
                             # 채 비례항만 남아 루프 권한이 줄었다 — 그래서 주기가 갈수록
                             # RMSE 가 커졌다 (양압5: 0.41 → 1.02 → 2.10).
                             # 채터는 이제 미분항이 잡으므로 적분을 다시 열어 준다.
                             # 참고: 지연은 상호상관으로 재면 전 사이클 0 ms 다 —
                             #       회귀 계수로 본 "지연 증가" 는 인공물이었다.
                             # 20260910_205202 (6축 사인 amp20/T40) 근거:
                             # 그 파형의 최대 기울기는 1.57 kPa/s 뿐이고, 밸브 감도가
                             # 2.5~7.7 kPa/s per %p 이므로 추종에 필요한 유효개도는
                             # **0.2~0.6 %p** 다. 적분 상한 12 는 그보다 19~59 배다.
                             # 실제로 적분이 상한까지 차서 챔버를 ±7 kPa 흔들었다
                             # (축4: micro 45→69, atm 40→60 을 2~3 Hz 로 번갈았다).
                             # 4 %p 면 데드존 부족보상 0.5 와 누설 보상에 충분하다.
      i_deadband_kpa: 0.0
      band_kpa: 0.0
      i_reset_on_step_kpa: 1.0   # 목표가 점프하면 적분을 버린다 (반대 부호 이월 방지)

      # ── 동작점(차압) 이득 보정 ──────────────────────────────────────────
      # 유량 ∝ 차압. 그 순간 열릴 밸브의 차압으로 나눠 보정한다.
      #   충전 micro : 차압 = 레일 − 챔버  → 챔버가 **높을수록** 약해진다
      #   배기 atm   : 차압 = 챔버 − 대기  → 챔버가 **낮을수록** 약해진다
      # 상한을 1.8 → 3.5 로 올린다. 챔버 110 에서 배기 차압이 8.7 뿐이라
      # 60/8.7 = 6.9 배가 필요한데 1.8 에서 잘리고 있었다.
      gain_dp_ref_kpa: 60.0
      gain_scale_min: 0.6
      gain_scale_max: 2.0    # ← 3.5
                             # 3.5 는 챔버 110 에서 **배기** 차압이 8.7 뿐일 때를 보고
                             # 잡은 값이다. 그런데 6축 동시 운전에서 양압 레일이
                             # 200 → 148 로 무너지면서 **충전** 차압도 0~15 로 떨어져,
                             # micro 게인까지 상시 3.5 배로 부풀려졌다. 그게 진동의
                             # 두 번째 원인이다.

      # ── 양압 하강(배기)은 충전보다 **크게** ─────────────────────────────
      # 위 실측대로 배기가 %p 당 1/3 밖에 안 된다. 상승의 약 2.5 배를 준다.
      # (지난 회차의 1/3 은 정반대 방향이었다 — 그래서 하강만 8 배 느렸다.)
      #   e=2  @챔버130 → u_pid 3.0 × 배율 2.09 = 6.3
      #   e=10 @챔버130 → u_pid 12.9 × 2.09 = 27   → 약 25 kPa/s, 10 kPa 를 0.4 s
      #   e=10 @챔버115 → 배율이 3.5 로 걸려 더 크게 연다 (차압 13.7 뿐이라 필요)
      # ── 레퍼런스 속도 피드포워드 (20260911 신설) ─────────────────────────
      # 사인 반전에서 12채널 전부 1.5~3 kPa 오차가 났다 (20260911_170834).
      # 오차 부호가 원인을 말해 준다: 바닥에서 −3.0, 꼭대기에서 +2.4 = 목표가
      # 돈 뒤에도 3~4 초 동안 **원래 방향으로 계속 갔다**. 필요한 지령은 목표의
      # 속도에 비례하는데 PI 는 그걸 적분으로만 만들 수 있고, 반전 구간은 오차가
      # 0 근처라 적분이 ki·e 로 느리게만 움직인다. 속도 항을 직접 넣는다.
      #
      # kv ≈ 1 / (플랜트 기울기 [kPa/s per %p]).
      #   이 동작점의 닫힌루프 회귀 = 양압 2.6 / 음압 1.9
      #     (단 R² 0.01~0.23 — 데드존 표의 차압 의존이 섞여 과대추정이다)
      #   개루프 데드존 측정에서 환산 = 양압 상승 ≈ 1.0
      # 그 중간에서 출발한다. 이 사인(진폭 10, 주기 40 s)의 최대 |dP_ref/dt| 는
      # 1.57 kPa/s 라 kv 1.0 의 기여는 최대 1.6 %p 다 — 과해도 안전한 크기다.
      # 반전 오차가 남으면 올리고, 반전에서 **반대쪽으로** 넘치면 내린다.
      # 20260911_172023 재측정: kv 1.0/1.5 로 돌려 보니 반전 오차가 양압 1.68 →
      # 1.60, 음압 1.20 → 1.04 로 방향만 맞고 크기가 턱없이 작았다.
      # 표 오차에 무관한 방법으로 다시 쟀다 — 데드존 표를 빼서 u_pid 를 복원하고
      # 그 **진폭**을 dref 진폭(1.55 kPa/s)으로 나눴다 (표 오차는 DC 라 진폭에
      # 안 들어간다):
      #   양압 ch0~5 : 3.50 3.23 2.81 2.85 3.84 3.42  (중앙값 3.33)
      #   음압 ch6~11: 3.48 2.04 1.67 2.18 2.47 2.04  (중앙값 2.11)
      # 즉 3배 작았다. 작으면 나머지를 적분이 만드는데, 적분이 그걸 만드는 시간이
      # 곧 반전 오차라서 "ff 를 조금 넣고 적분이 나머지" 는 효과가 거의 없다.
      # ff 가 필요량의 대부분을 내야 적분이 개입할 일이 없어진다.
      #
      # ★ 2.1/2.7/4.0 으로 올려 봤다가 **되돌렸다** (20260911_173225).
      #   양압 RMSE 0.25 → 3.60, 최대오차 15.9 kPa. 음압은 거의 그대로였다.
      #   원인: ff 에도 차압 보정 gs 가 곱해지는데, 이 동작점에서 gs 가 상한
      #   2.0 에 **붙어 있다** (양압 micro 차압 15~35, atm 차압 9~29 → 60/dp 가
      #   1.7~6.7 이라 전부 clamp). 즉 실효 kv = 2.0 × yaml 값이다.
      #   위에서 잰 "필요량 3.33" 은 **실효값**이므로 yaml 에는 3.33/2.0 ≈ 1.7 을
      #   써야 했는데 2.7/4.0 을 넣어 실효 5.4/8.0 = 2~2.4배 과했다.
      #   → 아래 1.0/1.5 는 실효 2.0/3.0 으로 이미 필요량 근처였다. 172023 에서
      #     반전 오차가 조금밖에 안 준 것은 ff 가 모자라서가 아니라 이미 거의
      #     맞았기 때문이다. 더 올릴 여지는 없다.
      #   다시 건드릴 거면 yaml 기준 1.7 을 넘기지 말 것.
      kv: 1.0                # [%p per (kPa/s)]  실효 = gs(≈2.0) × 이 값.  0 = 끔
      ref_rate_tau_s: 0.3    # 목표 속도 저역통과 [s] — 목표는 10 Hz 계단으로 온다
      ff_limit_pct: 15.0     # 피드포워드 항 상한 [%p]

      pos:
        down:
          kp: 1.5            # 상승 0.6 의 2.5 배   ← 0.2
          kp_far: 1.2        # 상승 0.6 의 2.0 배   ← 0.33
          kv: 1.5            # 배기는 %p 당 유량이 충전의 1/3 이라 더 열어야 한다

    # 채널별로 다르게 주려면 (없으면 위 값 사용):
    #   channel_config:
    #     ch1:
    #       pid: { kp: 1.2, ki: 4.0, up: { kp: 0.5 }, down: { kp: 1.2 } }
    #       volume_ml: 50.0        # 챔버 부피 (actuator_connected=false 일 때)
    #       volume_scale: 1.0      # 기하 모델 부피 배율 (연결 시)
    # (데드존 표는 아래 2번 항목이 관리한다 — 손으로 적지 말고 스크립트로 재라.)

    # ══ 2. 밸브 데드존 (죽은 구간) 보상 ═══════════════════════════════════
    # 정상폐쇄 밸브는 어떤 지령까지 전혀 열리지 않는다. 그 구간에서 만든 제어량은
    # 통째로 버려지므로, PID 출력의 원점을 죽은 구간 끝으로 옮긴다:
    #
    #   u_hw = deadzone(차압) + u_pid
    #
    # **밸브 모델을 쓰지 않는다.** 아래 표는 실기에서 직접 잰 값이다:
    #
    #     python3 src/can_powerpack/scripts/valve_deadzone.py --write
    #
    # (pp_controller 를 끄고, 펌프를 켠 채로 돌린다. 채널을 차압별 압력에 세워 두고
    #  밸브를 조금씩 열어, 자연 누설보다 확실히 빠르게 압력이 움직이는 지령을 찾는다.)
    #
    # 왜 차압별인가: 상류압이 스풀을 여는 방향으로 밀어서 차압이 크면 더 낮은 지령에
    # 열린다. 실측(20260908_161244)에서 챔버압 10 kPa 변화가 임계를 0.5 %p 옮겼다 —
    # 사인파 한 주기 안에서도 데드존이 계속 움직인다. 상수로 보상하면 반주기는 덜 열고
    # 반주기는 더 열게 된다. 컨트롤러가 매 틱 실제 차압으로 이 표를 선형보간한다
    # (표 밖은 클램프 — 재지 않은 차압에서 외삽하지 않는다).
    #
    # 왜 모델을 버렸나: 13-parameter 가 6채널 공용이라 모델 임계가 채널별 실제 임계와
    # 최대 2 %p 어긋났다. 그 결과 양압 micro 만 임계 **아래**에 놓여 간헐 펄스로 열렸고
    # (20260908_171520: 양압 RMSE 2.0~2.7, 잔차 p-p 10~21), 음압은 우연히 열리는 쪽으로
    # 어긋나 잘 됐다 (RMSE 0.9, 잔차 4.6). 음압이 70 kPa 진폭까지 잘 따라간 것을 보면
    # 차압이나 물리의 문제가 아니라 **임계 추정 오차**의 문제였다.
    # ===== valve_deadzone.py 측정 결과 (자동 생성) =====
    # 갱신 2026-09-11 12:10:53 — scripts/valve_deadzone.py (회차 5, 피팅 4차, 표 간격 5 kPa, 범위 channel)
    # dp_kpa = 차압(상류−하류) [kPa], u_pct = 그 차압에서 열리기 시작하는 지령 [%]
    # 컨트롤러는 매 틱 실제 차압으로 이 표를 선형보간한다 (양 끝은 클램프).
    # 우선순위: channel_config.chN.deadzone > valve_deadzone.{pos,neg} > 상수
