    RefTcp:
      enable: false
      host: "169.254.46.254"
      # host: '127.0.0.1'
      port: 2292
      expect_n: 12
      pressure_scale: 0.003052

    # 제어 모드 선택
    # 0: 압력 제어 — TCP가 [double pos_kpa, double neg_kpa] 수신 → MPC 직접 구동
    # 1: 위치 제어(휴리스틱) — 위치 PID → delta[kPa] → bias ± delta·neg_coupling
    #               라인압은 고정 상수(LinePID.pos/neg.ref)를 추종. A/B 비교용으로 유지.
    # 2: 위치 제어(최적화) — 위치 PID → 목표 토크 → PressureRefGen
    #               슬루 제약 하에서 12개 목표 압력을 최적화하고 라인압 셋포인트도
    #               수요에 따라 펌프 능력경계 위에서 재배분한다.
    control_mode: 2

    # ──────────────────────────────────────────
    # 액추에이터 기하 (부피식 + 토크 환산의 단일 출처)
    # 실측: 피스톤 지름 50 mm, 조인트~피스톤 로드(릴) 25 mm, 반대쪽 150 mm 링크에 5 kg
    #   A = π×25² = 1963.5 mm²
    #   토크 = reel × (A·P⁺ᵍ − A·P⁻ᵍ),  정격에서 τ_max = 7.76 N·m
    #   중력  = 5×9.81×0.15 = 7.36 N·m @90°  → 여유 5% 뿐 (고각도에서 최적화가 중요)
    # 피스톤 변위 x = reel × θ_rad 이므로 부피식은 라디안 기준이다.
    # ──────────────────────────────────────────
    Geometry:
      piston_dia_mm: 50.0
      reel_radius_mm: 25.0
      vol_offset_pos_mm: 40.0    # θ=0 에서의 양압 챔버 사구간 길이
      vol_offset_neg_mm: 90.0    # θ=0 에서의 음압 챔버 사구간 길이

      # 스트로크 → 부피 배수. **부피식에만** 곱한다 (토크 환산 F = τ/reel 에는 안 쓴다).
      #
      # 이 액추에이터는 단순 피스톤이 아니다 — 수축하면서 **옆면도 같이 좁아진다.**
      # 그래서 부피 변화가 A_바닥 × 스트로크 보다 크다. 기준 부피(θ=0)는 그대로 두고
      # 변화율만 키우려면 스트로크에 배수를 곱하면 된다:
      #     V = tank + A × max(0, offset ± mult·reel·θ)
      #     V̇ 도 같은 배수를 쓴다 (안 그러면 부피와 그 미분이 다른 기하가 된다)
      #
      # 1.0 = 단순 피스톤(예전 동작). **실제 배수를 넣을 것.**
      #
      # ⚠ 부피는 dP/dt = ṁ·R·T/V 의 분모라 **그대로 내층 이득**이다.
      #   과대평가 → 모델이 유량을 더 요구 → 과개방 → 오버슛·진동
      #   과소평가 → 굼뜸·정상상태 오차
      #   S-37 에서 같은 기전으로 axis1 이 진동했다 (유효 부피가 모델의 1/5 이라
      #   MPC 가 5 배 유량을 요구했다). 한 번에 하나씩 바꾸고 결과를 볼 것.
      # 20260904 실측 (scripts/volume_probe.py, volprobe_20260904_145704):
      #   밸브를 전부 닫고 팔을 손으로 19~67° 움직이며 1/P = a + b·θ + c·t 피팅.
      #   c(누설)를 같이 풀어야 한다 — 안 넣으면 R² 가 0.014 로 무너진다.
      #   양압 P⁺:  유효 스트로크 3 개, m 1.95 / 1.99 / 2.08  → **1.99**  (R² 0.92~0.98)
      #             dV/dθ = +97.5 mL/rad  (단순 피스톤 +49.1)
      #   음압 P⁻:  1.24 로 나왔지만 평균 100.4 kPa · 변화 6.4 kPa 로 대기압에 붙어
      #             신호가 없다. **미측정으로 본다.** 음압을 50 kPa 쯤으로 뽑아 두고
      #             다시 재야 한다.
      # 지금은 양·음압에 같은 값이 걸린다. 음압이 다르다고 판명되면 그때 나눌 것.
      # ⚠ 20260904 15:03 실기: 2.0 을 넣었더니 **터졌다.**
      #   20° 유지에서 각도 σ 0.05° → **8.23°**, p-p 30.8°.
      #   부피가 커지면 역모델 요구 유량(P_dot·V/RT)이 커져 지령이 세지는데,
      #   이 내층은 그 이득을 못 견딘다 (크래킹 비례대역이 5.2 %p 라 조금만
      #   세져도 온/오프가 된다). **측정값이 물리적으로 맞더라도** 컨트롤러가
      #   견디지 못하면 넣을 수 없다 — S-41/S-42 와 같은 교훈이다.
      #   1.0 으로 되돌린다. 실측 m≈2.0 을 쓰려면 내층 이득을 먼저 낮춰야 한다.
      stroke_volume_mult: 1.0

    # ──────────────────────────────────────────
    # 축별 토크 PID (control_mode 2). 게인 단위는 N·m/deg 계열.
    # 출발점은 mode 1 게인을 토크로 환산한 값 (1 kPa delta ≈ 0.098 N·m):
    #   kp 0.8 → 0.0786,  ki 0.3 → 0.0295,  kd 0.05 → 0.0049
    #
    # 6축 시뮬레이터 튜닝 결과 (20/45/70° 스텝, 축별 다른 각도 포함):
    #   ki 0.0295 → 0.20  : 쿨롱 마찰 데드밴드를 적분으로 밀어낸다.
    #                       오차 RMS 0.26° → 0.04° (0.0295 에서는 수렴에 4분 걸림)
    #   friction_nm 0.30 → 0.48 : 시뮬 쿨롱 0.50 에 맞춤. 과보상 채터를 피해 조금 낮게.
    #   kd 0.0049 → 0.04  : 오버슈트 2.5° → 1.0°. 단 vel_filter_alpha 를 함께
    #                       0.05 → 0.3 으로 풀어야 효과가 난다 (필터 지연 때문에
    #                       alpha 0.05 에서는 kd 를 8배 올려도 변화 없음).
    #   kd 를 0.09 로 더 올리면 정착이 3.6 → 4.6 s 로 나빠져 0.04 에서 멈췄다.
    # ──────────────────────────────────────────
    TorquePID:
      axis0:
        kp: 0.0786
        ki: 0.20
        # 0.04 → 0.02. 실기 20260829_191758 의 45° 부근 한계진동(1.45 Hz, ±7°)에서
        # kd·vel = 0.04 × 64 dps = 2.55 N·m 로 kp·err(0.0786 × 7 = 0.55)의 **4.6 배**
        # 였다 — D 가 지배하는 루프다. 그런데 1.45 Hz 에서는 속도 LPF(τ 67 ms)만으로도
        # 위상이 31° 밀리고 압력 루프 지연이 더해져 D 의 위상 앞섬이 이미 깎여 있다.
        # 감쇠가 아니라 지연된 고이득 되먹임으로 작동해 진동을 키웠다
        # (τ_ref 가 0.00 ↔ 4.51 N·m 로 뱅뱅했다. 45° 중력은 2.08 N·m).
        kd: 0.02
        integ_limit_nm: 0.75      # 2.0 → 0.75 : 부하가 5 kg → 2 kg 이 되어 τ_max 가 7.76 → 2.94 N·m 다.
                                  # 2.0 이면 τ_max 의 68% 라 적분만으로 축이 흔들린다. 같은 비율(26%)로 맞췄다.
        friction_nm: 0.48
        # 마찰 보상 밴드 [deg]. 오차가 이 안이면 friction_nm 을 선형으로 준다.
        # 0 이면 예전의 하드 sign — err 이 0 을 지날 때마다 ±0.48 이 통째로
        # 뒤집혀 0.96 N·m 계단이 된다 (중력 최대 2.94 N·m 의 33%).
        friction_band_deg: 1.0
        # 중력 피드포워드 배율. **액추에이터 미연결 시험용으로 낮춰 뒀다.**
        # 1.0 이면 45° 에서 5.20 N·m → 208 N 을 요구하는데, 그 힘은 양압 정격
        # (185 kPa abs) 단독으로 못 내서 생성기가 음압을 30 kPa 까지 끌어내린다.
        # 0.5 면 104 N → 양압 154 kPa 단독으로 충분해 음압을 쓰지 않는다.
        # **액추에이터를 붙이면 1.0 으로 되돌릴 것** — 그때는 중력을 실제로 든다.
        tau_ff_gain: 1.0   # 0.5 → 1.0 : 액추에이터를 붙였다 (150 mm 링크 · 2 kg). 중력을 실제로 든다.         # 쿨롱 마찰 보상 [N·m]
      axis1:
        kp: 0.0786
        ki: 0.20
        # 0.04 → 0.02. 실기 20260829_191758 의 45° 부근 한계진동(1.45 Hz, ±7°)에서
        # kd·vel = 0.04 × 64 dps = 2.55 N·m 로 kp·err(0.0786 × 7 = 0.55)의 **4.6 배**
        # 였다 — D 가 지배하는 루프다. 그런데 1.45 Hz 에서는 속도 LPF(τ 67 ms)만으로도
        # 위상이 31° 밀리고 압력 루프 지연이 더해져 D 의 위상 앞섬이 이미 깎여 있다.
        # 감쇠가 아니라 지연된 고이득 되먹임으로 작동해 진동을 키웠다
        # (τ_ref 가 0.00 ↔ 4.51 N·m 로 뱅뱅했다. 45° 중력은 2.08 N·m).
        kd: 0.02
        integ_limit_nm: 0.75      # 2.0 → 0.75 : 부하가 5 kg → 2 kg 이 되어 τ_max 가 7.76 → 2.94 N·m 다.
                                  # 2.0 이면 τ_max 의 68% 라 적분만으로 축이 흔들린다. 같은 비율(26%)로 맞췄다.
        friction_nm: 0.48
        # 마찰 보상 밴드 [deg]. 오차가 이 안이면 friction_nm 을 선형으로 준다.
        # 0 이면 예전의 하드 sign — err 이 0 을 지날 때마다 ±0.48 이 통째로
        # 뒤집혀 0.96 N·m 계단이 된다 (중력 최대 2.94 N·m 의 33%).
        friction_band_deg: 1.0
        # 중력 피드포워드 배율. **액추에이터 미연결 시험용으로 낮춰 뒀다.**
        # 1.0 이면 45° 에서 5.20 N·m → 208 N 을 요구하는데, 그 힘은 양압 정격
        # (185 kPa abs) 단독으로 못 내서 생성기가 음압을 30 kPa 까지 끌어내린다.
        # 0.5 면 104 N → 양압 154 kPa 단독으로 충분해 음압을 쓰지 않는다.
        # **액추에이터를 붙이면 1.0 으로 되돌릴 것** — 그때는 중력을 실제로 든다.
        tau_ff_gain: 1.0   # 0.5 → 1.0 : 액추에이터를 붙였다 (150 mm 링크 · 2 kg). 중력을 실제로 든다.
      axis2:
        kp: 0.0786
        ki: 0.20
        # 0.04 → 0.02. 실기 20260829_191758 의 45° 부근 한계진동(1.45 Hz, ±7°)에서
        # kd·vel = 0.04 × 64 dps = 2.55 N·m 로 kp·err(0.0786 × 7 = 0.55)의 **4.6 배**
        # 였다 — D 가 지배하는 루프다. 그런데 1.45 Hz 에서는 속도 LPF(τ 67 ms)만으로도
        # 위상이 31° 밀리고 압력 루프 지연이 더해져 D 의 위상 앞섬이 이미 깎여 있다.
        # 감쇠가 아니라 지연된 고이득 되먹임으로 작동해 진동을 키웠다
        # (τ_ref 가 0.00 ↔ 4.51 N·m 로 뱅뱅했다. 45° 중력은 2.08 N·m).
        kd: 0.02
        integ_limit_nm: 0.75      # 2.0 → 0.75 : 부하가 5 kg → 2 kg 이 되어 τ_max 가 7.76 → 2.94 N·m 다.
                                  # 2.0 이면 τ_max 의 68% 라 적분만으로 축이 흔들린다. 같은 비율(26%)로 맞췄다.
        friction_nm: 0.48
        # 마찰 보상 밴드 [deg]. 오차가 이 안이면 friction_nm 을 선형으로 준다.
        # 0 이면 예전의 하드 sign — err 이 0 을 지날 때마다 ±0.48 이 통째로
        # 뒤집혀 0.96 N·m 계단이 된다 (중력 최대 2.94 N·m 의 33%).
        friction_band_deg: 1.0
        # 중력 피드포워드 배율. **액추에이터 미연결 시험용으로 낮춰 뒀다.**
        # 1.0 이면 45° 에서 5.20 N·m → 208 N 을 요구하는데, 그 힘은 양압 정격
        # (185 kPa abs) 단독으로 못 내서 생성기가 음압을 30 kPa 까지 끌어내린다.
        # 0.5 면 104 N → 양압 154 kPa 단독으로 충분해 음압을 쓰지 않는다.
        # **액추에이터를 붙이면 1.0 으로 되돌릴 것** — 그때는 중력을 실제로 든다.
        tau_ff_gain: 1.0   # 0.5 → 1.0 : 액추에이터를 붙였다 (150 mm 링크 · 2 kg). 중력을 실제로 든다.

      axis3:
        kp: 0.0786
        ki: 0.20
        # 0.04 → 0.02. 실기 20260829_191758 의 45° 부근 한계진동(1.45 Hz, ±7°)에서
        # kd·vel = 0.04 × 64 dps = 2.55 N·m 로 kp·err(0.0786 × 7 = 0.55)의 **4.6 배**
        # 였다 — D 가 지배하는 루프다. 그런데 1.45 Hz 에서는 속도 LPF(τ 67 ms)만으로도
        # 위상이 31° 밀리고 압력 루프 지연이 더해져 D 의 위상 앞섬이 이미 깎여 있다.
        # 감쇠가 아니라 지연된 고이득 되먹임으로 작동해 진동을 키웠다
        # (τ_ref 가 0.00 ↔ 4.51 N·m 로 뱅뱅했다. 45° 중력은 2.08 N·m).
        kd: 0.02
        integ_limit_nm: 0.75      # 2.0 → 0.75 : 부하가 5 kg → 2 kg 이 되어 τ_max 가 7.76 → 2.94 N·m 다.
                                  # 2.0 이면 τ_max 의 68% 라 적분만으로 축이 흔들린다. 같은 비율(26%)로 맞췄다.
        friction_nm: 0.48
        # 마찰 보상 밴드 [deg]. 오차가 이 안이면 friction_nm 을 선형으로 준다.
        # 0 이면 예전의 하드 sign — err 이 0 을 지날 때마다 ±0.48 이 통째로
        # 뒤집혀 0.96 N·m 계단이 된다 (중력 최대 2.94 N·m 의 33%).
        friction_band_deg: 1.0
        # 중력 피드포워드 배율. **액추에이터 미연결 시험용으로 낮춰 뒀다.**
        # 1.0 이면 45° 에서 5.20 N·m → 208 N 을 요구하는데, 그 힘은 양압 정격
        # (185 kPa abs) 단독으로 못 내서 생성기가 음압을 30 kPa 까지 끌어내린다.
        # 0.5 면 104 N → 양압 154 kPa 단독으로 충분해 음압을 쓰지 않는다.
        # **액추에이터를 붙이면 1.0 으로 되돌릴 것** — 그때는 중력을 실제로 든다.
        tau_ff_gain: 1.0   # 0.5 → 1.0 : 액추에이터를 붙였다 (150 mm 링크 · 2 kg). 중력을 실제로 든다.

      axis4:
        kp: 0.0786
        ki: 0.20
        # 0.04 → 0.02. 실기 20260829_191758 의 45° 부근 한계진동(1.45 Hz, ±7°)에서
        # kd·vel = 0.04 × 64 dps = 2.55 N·m 로 kp·err(0.0786 × 7 = 0.55)의 **4.6 배**
        # 였다 — D 가 지배하는 루프다. 그런데 1.45 Hz 에서는 속도 LPF(τ 67 ms)만으로도
        # 위상이 31° 밀리고 압력 루프 지연이 더해져 D 의 위상 앞섬이 이미 깎여 있다.
        # 감쇠가 아니라 지연된 고이득 되먹임으로 작동해 진동을 키웠다
        # (τ_ref 가 0.00 ↔ 4.51 N·m 로 뱅뱅했다. 45° 중력은 2.08 N·m).
        kd: 0.02
        integ_limit_nm: 0.75      # 2.0 → 0.75 : 부하가 5 kg → 2 kg 이 되어 τ_max 가 7.76 → 2.94 N·m 다.
                                  # 2.0 이면 τ_max 의 68% 라 적분만으로 축이 흔들린다. 같은 비율(26%)로 맞췄다.
        friction_nm: 0.48
        # 마찰 보상 밴드 [deg]. 오차가 이 안이면 friction_nm 을 선형으로 준다.
        # 0 이면 예전의 하드 sign — err 이 0 을 지날 때마다 ±0.48 이 통째로
        # 뒤집혀 0.96 N·m 계단이 된다 (중력 최대 2.94 N·m 의 33%).
        friction_band_deg: 1.0
        # 중력 피드포워드 배율. **액추에이터 미연결 시험용으로 낮춰 뒀다.**
        # 1.0 이면 45° 에서 5.20 N·m → 208 N 을 요구하는데, 그 힘은 양압 정격
        # (185 kPa abs) 단독으로 못 내서 생성기가 음압을 30 kPa 까지 끌어내린다.
        # 0.5 면 104 N → 양압 154 kPa 단독으로 충분해 음압을 쓰지 않는다.
        # **액추에이터를 붙이면 1.0 으로 되돌릴 것** — 그때는 중력을 실제로 든다.
        tau_ff_gain: 1.0   # 0.5 → 1.0 : 액추에이터를 붙였다 (150 mm 링크 · 2 kg). 중력을 실제로 든다.

      axis5:
        kp: 0.0786
        ki: 0.20
        # 0.04 → 0.02. 실기 20260829_191758 의 45° 부근 한계진동(1.45 Hz, ±7°)에서
        # kd·vel = 0.04 × 64 dps = 2.55 N·m 로 kp·err(0.0786 × 7 = 0.55)의 **4.6 배**
        # 였다 — D 가 지배하는 루프다. 그런데 1.45 Hz 에서는 속도 LPF(τ 67 ms)만으로도
        # 위상이 31° 밀리고 압력 루프 지연이 더해져 D 의 위상 앞섬이 이미 깎여 있다.
        # 감쇠가 아니라 지연된 고이득 되먹임으로 작동해 진동을 키웠다
        # (τ_ref 가 0.00 ↔ 4.51 N·m 로 뱅뱅했다. 45° 중력은 2.08 N·m).
        kd: 0.02
        integ_limit_nm: 0.75      # 2.0 → 0.75 : 부하가 5 kg → 2 kg 이 되어 τ_max 가 7.76 → 2.94 N·m 다.
                                  # 2.0 이면 τ_max 의 68% 라 적분만으로 축이 흔들린다. 같은 비율(26%)로 맞췄다.
        friction_nm: 0.48
        # 마찰 보상 밴드 [deg]. 오차가 이 안이면 friction_nm 을 선형으로 준다.
        # 0 이면 예전의 하드 sign — err 이 0 을 지날 때마다 ±0.48 이 통째로
        # 뒤집혀 0.96 N·m 계단이 된다 (중력 최대 2.94 N·m 의 33%).
        friction_band_deg: 1.0
        # 중력 피드포워드 배율. **액추에이터 미연결 시험용으로 낮춰 뒀다.**
        # 1.0 이면 45° 에서 5.20 N·m → 208 N 을 요구하는데, 그 힘은 양압 정격
        # (185 kPa abs) 단독으로 못 내서 생성기가 음압을 30 kPa 까지 끌어내린다.
        # 0.5 면 104 N → 양압 154 kPa 단독으로 충분해 음압을 쓰지 않는다.
        # **액추에이터를 붙이면 1.0 으로 되돌릴 것** — 그때는 중력을 실제로 든다.
        tau_ff_gain: 1.0   # 0.5 → 1.0 : 액추에이터를 붙였다 (150 mm 링크 · 2 kg). 중력을 실제로 든다.

    # ──────────────────────────────────────────
    # 최적화 기반 압력 레퍼런스 생성기 (pressure_reference_optimizer.m 포팅)
    #
    # 매 period_ms 마다:
    #   ① 프리뷰 총 수요로 레일 셋포인트를 펌프 능력경계 위에서 배분
    #   ② 지금 이 순간의 차압에서 실제 밸브 유량 → 한 스텝 슬루 박스
    #   ③ 박스 안에서 목표 토크에 최대한 근접하는 12개 압력을 최적화 (소프트 추종)
    #
    # 채널 정격은 PositionController.axis0 의 p_pos_max_kpa / p_neg_min_kpa 를 그대로
    # 게이지로 변환해 쓴다 (현재 185 / 27 kPa abs = +83.7 / −74.3 kPa gauge).
    # ──────────────────────────────────────────
    PressureRefGen:
      period_ms: 20              # 생성기 주기 (제어 500 Hz 의 10 tick 마다 1회)
      # 생성기가 낸 압력 레퍼런스의 슬루 제한 [kPa/s]. 0 이하면 끔.
      # 모드 1 에는 ref_slew_kpa_per_s 가 있었는데 모드 2 에는 없어서 생성기 출력이
      # 그대로 MPC 로 갔다. 실기 20260829_165306 에서 40 ms 사이에 P⁻ 레퍼런스가
      # 101.3 → 51.3 → 101.0 kPa (≈1250 kPa/s) 로 튀었다 — 챔버가 따라갈 수 없는
      # 명령이라 밸브만 두들기고 액추에이터에는 충격으로 간다.
      # 150 이면 필요한 42 kPa 이동에 0.28 s 라 응답은 안 죽이고 떨림만 걸러진다.
      # 150 → 400. **150 은 정상 동작에서 이미 포화하고 있었다.**
      # 되먹임 고리 안의 포화된 레이트 리미터는 최대 90° 의 위상 지연을 만든다 —
      # 한계진동의 전형적인 원인이다. 실기 20260829_194658 (2 축, 목표 60° 유지):
      #
      #            제한의 90% 이상에 걸린 비율   각도 진폭(p-p)
      #     axis0            7.2%                  18.5°
      #     axis1           27.5%                  27.2°     ← 사용자가 지목한 축
      #
      # 두 축의 게인·질량·기하는 같다. 다른 것은 **리미터에 얼마나 걸리느냐** 뿐이고,
      # 그게 그대로 진폭 차이로 나왔다. 억제하려던 떨림은 1250 kPa/s 였고 정상
      # 수요는 평균 30~55 / 최대 183 kPa/s 다 — 400 이면 정상 수요에 2 배 여유를
      # 두면서 떨림은 여전히 3 배로 자른다. 0 이하면 끔.
      ref_slew_kpa_per_s: 400.0
      n_chamber: 1.4             # 챔버는 단열 (1스텝 20 ms ≪ 열 시상수 0.4~4 s)
      n_rail: 1.0                # 레일/탱크는 등온 (초 단위로 느림)
      preview_steps: 1           # 1 = 프리뷰 끔 (현재 수요만). 상위 계획기 붙으면 100(2s)
      sqp_max_iter: 12
      Cd: 0.8                    # 방출계수 — 제조사 Cv 확보 시 교체 (실측 대상)

      # ── 한 스텝 평균 개도 계수 eta ∈ (0,1] ────────────────────────────────
      # 슬루 박스는 "밸브를 열면 이번 스텝에 얼마나 갈 수 있나"를 묻는데, 기하 오리피스
      # 면적(Cd·πd²/4)을 그대로 쓰면 **완전 개방**을 가정하게 된다. 해설서가 실측 대상으로
      # 남겨둔 항목이고(7.3절), 이제 13-variable 밸브 모델로 값을 유도할 수 있다.
      #
      # 두 성분이 있다.
      #  ① eta_static — 지령 100% 에서 실제 도달하는 개도 비율 A_eff(100%)/A_max.
      #     C_p·Pin 항 때문에 상류 압력에 따라 달라진다:
      #        Pin[kPa abs]  110    155    250    351    700
      #        eta_static    0.728  0.767  0.833  0.885  0.970
      #  ② eta_dyn — 2차 밸브 동역학(wn_up=40 rad/s, zeta=1.2)의 스텝 응답 평균.
      #     20 ms 동안 정상유량의 17.7% 까지만 오르고 구간 평균은 **0.068** 이다.
      #     (밸브 지배 시상수 ≈46 ms 로 생성기 주기 20 ms 보다 훨씬 느리다)
      #
      # eta_dyn 은 일부러 곱하지 않았다. 그건 "매 스텝마다 닫힌 상태에서 새로 연다"는
      # 가정인데, 실제 과도 구간에서는 밸브가 계속 열려 있으므로 첫 스텝에만 해당한다.
      # 곱하면 (0.75×0.068 = 0.05) 박스가 20배 좁아져 레퍼런스가 거의 못 움직인다.
      # → eta_static 의 보수적 하단인 0.75 를 쓴다. 남는 낙관성은 과도 구간 **첫 스텝**
      #   하나뿐이고, 정착이 100 스텝 규모이므로 영향이 작다.
      #
      # 크래킹 임계는 여기 반영하지 않는다: 슬루 박스는 지령 100% 기준의 능력 판정이라
      # 임계(≈50%) 위쪽에서 평가되기 때문이다. 크래킹은 MPC 명령 테이퍼가 다룬다
      # (MPC_parameters.valve_crack_area_frac).
      #
      # 실측 시: 완전개방 지령에서의 정상 유량 / 기하 면적 기준 이론 유량 = eta_static.
      #
      # ── 기본값을 1.0 으로 둔 이유 ────────────────────────────────────────
      # 물리적으로 맞는 값은 0.75 지만, 켜면 배기(vent/admit) 면적까지 깎여 압력 하강도
      # 느려지므로 **플랜트 자체가 바뀐다**. 그 위에서 튜닝된 TorquePID 가 그대로 맞을
      # 이유가 없으므로, 기본은 1.0(기존 동작 유지)으로 두고 재튜닝과 함께 켠다.
      #
      # eta=0.75 로 관측된 것 (6축 45° 스텝, 2회):
      #   정상상태가 "P⁺ 를 정격(185)까지 올리고 음압을 포기하는" 동점해로 옮겨갔다
      #   (P⁺ 183~184 / P⁻ 84, 기준선은 P⁺ 139~143 / P⁻ 34~38). 2회 모두 같았다.
      #   sqp_max_iter 를 40 으로 올려 it=11 로 완전 수렴시켜도 같은 해가 나오므로
      #   수렴 실패가 아니라 그 박스에서의 최적해다. 박스가 좁아지면 12 로는 부족하니
      #   켤 때 sqp_max_iter 도 40 정도로 올려야 한다.
      #
      # 단, 정착/오버슈트/밸브 개방률 차이는 **런 간 편차 안**이었다. 이 하네스는
      # 동일 빌드 반복 실행에서 오버슈트 +0.92~+2.27°, 최종 밸브 개방률 0~100% 로
      # 흩어진다 (실시간 타이머·스레드 스케줄 지터 때문). eta 를 켤지는 단일 실행이
      # 아니라 N회 평균으로 판단해야 한다.
      valve_open_eta: 1.0

      # ── 피스톤 펌프 기하 ────────────────────────────────────────────────
      # 흡입구 = 음압 레일, 토출구 = 양압 레일. 같은 피스톤이 왕복하므로 흡입량 = 토출량이고
      # 그래서 양압을 높이면 음압이 억눌리는 **능력경계**가 생긴다. 생성기는 펌프를 오직
      # cap_ppos(P⁻) → P⁺ 상한 으로만 쓴다 (flow_out/flow_in 은 호출조차 하지 않는다).
      #
      # 키 이름은 Virtual.pump.* 와 같다 — pump_params.yaml 하나로 생성기와 시뮬을 동시에
      # 갱신할 수 있게 맞췄다. 예전에는 생성기가 이 값을 **하드코딩**해서, 시뮬만 yaml 을
      # 따라가면 두 소비자가 아무 경고 없이 다른 펌프를 가정하는 구조였다.
      #
      # 아래 값은 **예전 펌프** 것이다. 물리적으로 이상하다: 소기량 924 LPM 인데 실측 토출이
      # ~1.1 g/s(≈0.9 L/s) 라 체적효율 6% 이고, Cb_out 이 1.46 mm² 뿐이라 유량이 전적으로
      # 토출 체크밸브에 막혀 있다. scripts/pump_fit_*.py 로 실측 교체할 것.
      pump:
        delta_m: 0.041            # 피스톤 최대 체적변화 길이 (사구간을 정한다)
        crank_m: 0.02             # 스트로크 = 2r = 40 mm
        rod_m: 0.07
        piston_area_m2: 0.0038485
        cb_out_m2: 0.00000146     # 토출 체크밸브 유효면적 1.46 mm²
        cb_in_m2: 0.00003347      # 흡입 체크밸브 유효면적 33.47 mm²
        rpm: 3000.0
        n_piston: 2               # 180° 위상
      pump_grid_n: 13             # 능력 테이블 격자 (기동 시 1회 계산)

      # 실제 밸브 오리피스 지름 [mm] (해설서 배관도 기준)
      orifice_mm:
        fill: 2.3                # 양압레일 → 챔버 (v1 micro)
        vent: 4.0                # 챔버 → 대기   (v2 atm)
        boost: 1.6               # 압축탱크 → 챔버 (v3 macro)
        suck: 4.0                # 챔버 → 음압레일 (v1 micro)
        admit: 4.0               # 대기 → 챔버   (v2 atm)
        eject: 4.0               # 챔버 → 이젝터 (v3 macro)

      # board 4 측정 음압을 이젝터 하류 압력으로 직접 사용 (해설서 권장 경로).
      # false 로 두면 선형 특성곡선 P_ej(Q) = P_ej_max(1 − Q/Q_max) 로 추정한다.
      use_ejector_measurement: true

      # 레일 셋포인트 배분 범위
      rail:
        neg_shallow_kpa: -30.0   # 저수요 시 음압 셋포인트 [kPa gauge]
        # 고수요 시 음압 레일 깊이 [kPa gauge]. 채널 정격(-74.3)과 별도 파라미터다 —
        # 45° 유지에 필요한 챔버 음압은 -22 kPa gauge 정도인데 레일을 -74 까지 뽑으면
        # 펌프 하나로 리저버(500 mL)+음압챔버 6개(1.36 L)를 그 깊이까지 비우는 시간이
        # 6축 정착시간을 지배한다. 챔버 수요보다 약간만 깊게 두는 것이 유리하다.
        neg_sp_deep_kpa: -74.3
        pos_sp_min_kpa: 30.0     # 저수요 시 양압 셋포인트 [kPa gauge]
        # 고수요 시 양압 셋포인트 [kPa gauge]. 원본은 400 이지만 우리 채널 정격이
        # 84 kPa gauge 뿐이라 400 은 과다하다. 250 이 정착시간·충전시간 균형점
        # (400 → 16.9 s, 250 → 16.9 s, 150 → 14.9 s 였고 이후 MPC 시상수가
        #  진짜 병목임이 드러나 250 으로 두었다).
        pos_sp_max_kpa: 250.0
        # 양압레일을 "가장 높은 챔버 레퍼런스 + 이 값" 으로 묶는다 [kPa]. 0 이하면 끔.
        # 셋포인트는 힘 수요로만 정해져 챔버 레퍼런스와 무관했다. 실기
        # 20260828_163335 에서 챔버 목표 114.3 kPa abs 인데 레일 셋포인트가
        # 283.9 abs 였고(필요량의 14 배), 그 차압이 밸브를 초킹 영역에 두어
        # 한 번 열 때마다 300 kPa/s 가 쏟아지며 챔버가 ±20 kPa 로 진동했다.
        pos_headroom_kpa: 60.0
        # 레일 셋포인트 감쇠 시정수 [s]. 0 이하면 끔.
        #
        # 셋포인트는 힘 수요(F_ref)로 정해지는데 그 수요는 위치 루프 리플을 그대로
        # 안고 있다. 그러면 레일 → 챔버 상한 → 챔버 레퍼런스 → 토크 → 레일 로 도는
        # 되먹임이 생긴다. 실기 20260829_195910 (3 축, 목표 60° 유지):
        #     τ_ref 리플 2.0~4.1 N·m p-p → need = τ/(reel·A) = 41~84 kPa p-p
        #     실측 레일 SP 리플  68.5 kPa p-p (1.73 Hz)
        #     실측 레일 압력     126.1 kPa p-p (1.73 Hz)
        # 그 리플이 세 축 챔버 레퍼런스에 30~43 kPa 로 돌아와 같은 1.0~1.7 Hz 로
        # 물려 돌았다. axis0·2 는 흡수(각도 p-p 4.6°/3.2°)했지만 axis1 은 ±11° 로
        # 증폭했다 — "2 번째 축만 진동" 의 정체다.
        # 레일은 초 단위로 느린 공유 공급원이다. 올릴 때는 즉시, 내릴 때만 감쇠.
        # **기본 끔(0).** 실측 레일 SP 신호에 이 필터를 통과시켜 보니 리플이
        # 68.5 → 47 kPa (감쇠 31%) 밖에 안 줄었다 — 상승 스파이크를 따라가기
        # 때문이다. 그리고 axis0·2 는 같은 레일 리플을 보고도 멀쩡했으므로
        # (각도 p-p 4.6°/3.2°) 이건 axis1 진동의 원인이 아니었다.
        # 코드는 남겨 뒀다. 나중에 레일 리플 자체를 잡을 때 켜 볼 것.
        sp_decay_tau_s: 0.0
        # 챔버 레퍼런스를 레일에서 이만큼 떨어뜨린다 [kPa]. 0 이하면 끔.
        # 챔버는 음압레일보다 깊어질 수도, 양압레일보다 높아질 수도 없다.
        # 슬루 박스는 한 스텝 유량만 보므로 사실상 전 구간이 열려 있었고(실기
        # 로그에서 P⁻ 경계가 늘 [27.0~101.3]), 레일이 40 kPa 일 때도 27 kPa 를
        # 목표로 내 챔버가 ±25 kPa 로 진동했다. 이 하한이 걸리면 최적화는 같은
        # 힘을 내려고 양압을 더 쓴다 — 음압만 혹사하는 문제도 함께 풀린다.
        chamber_neg_headroom_kpa: 15.0
        chamber_pos_headroom_kpa: 15.0
        # 공급압(레일·탱크·이젝터) 저역통과 시정수 [s]. 0 이하면 끔.
        # 챔버 레퍼런스의 경계가 레일 압력에서 나오므로, 수요가 커서 레퍼런스가
        # 경계에 붙으면 레일 리플이 그대로 레퍼런스 리플이 된다 — 목표 각도가
        # 고정인데도 레퍼런스가 흔들린다 (실기 20260828_181748, 6축 80° 고정에서
        # ref⁺ 와 ub⁺ 가 상관 0.998, 라인압 118~138 → 레퍼런스 103.7~124.3).
        # 레일이 실제로 내려앉는 것은 따라가되 리플만 없앤다.
        supply_filter_tau_s: 0.5
        demand_ref_N: 150.0      # 수요 정규화 기준 힘 (축 1개 '큰 힘')

      tank_stop_kpa: 450.0       # 이하로 떨어지면 tank_low 플래그 (교체/정지 판단)

      # macro 게이트 파라미터는 없다. 생성기가 내는 축별 유량 부족률
      # (Result::starve_pos/neg) 은 **진단값**일 뿐이고 밸브를 열지 않는다 —
      # 원본 MATLAB 도 update_sources 의 usage 를 버린다 (`[rail_next, ~] = ...`).
      # 실제 개방은 내층의 유량 분배가 정한다 (MPC_parameters 쪽 주석 참조).

      # 목적함수 가중치 — 원본 값 그대로
      # J_fast(빠른 쪽 우선)와 scarcity(잔량 반비례 증폭)는 원본 2차 검토에서 추종을
      # 해친다고 판정된 항이다. 가중치 0 으로 두는 대신 **코드에서 항 자체를 제거**했다
      # (매 SQP 반복의 수치 기울기 평가에서 빠진다). 되살릴 일이 없으므로 키도 없다.
      weights:
        track: 100.0             # 토크 소프트 추종 (지배적)
        flow: 0.3                # 총 가용유량 최대화 (반응 여지 확보)
        smooth: 0.5              # 압력 급변 억제
        tank: 15.0               # 탱크 부스트 사용 벌점 (레일 초과분에만)
        eject: 25.0              # 이젝터 사용 벌점 (탱크를 더 빨리 소모)

    RefTcpServer:
      enable: true
      port: 2293         # TCP server port
      pos_gid: 0         # 양압 채널 global_id (board 5)  [압력모드 전용]
      neg_gid: 6         # 음압 채널 global_id (board 11) [압력모드 전용]

    # ──────────────────────────────────────────
    # 위치 제어기 (축별 설정, num_actuators 개수만큼 axis0/axis1/... )
    #
    # 두 모드가 이 섹션을 공유하지만 **읽는 필드가 다르다**:
    #   공용 (mode 1, 2) : 채널/엔코더 매핑, 부하(mass·link), 채널 압력 정격, 속도 LPF
    #   mode1: 하위 블록 : 휴리스틱 위치 제어(외층 PID → bias ± delta) 전용 게인
    #
    # control_mode 2 는 `mode1:` 블록을 **전혀 읽지 않는다**. 그쪽에서 PID 는
    # TorquePID.axis* 가, 양압/음압 분배는 PressureRefGen 의 슬루 박스 최적화가,
    # 레퍼런스 슬루 제한은 그 박스가 물리적으로 담당한다.
    #
    # 6축 모두 동일 사양이므로 값은 같고 actuator_idx/pos_gid/neg_gid 만 다르다.
    #
    # 공용 정격의 의미:
    #   p_pos_max_kpa / p_neg_min_kpa 는 채널(액추에이터) 압력 정격이다.
    #   mode 1 은 출력 클램프로, mode 2 는 axis0 값을 게이지로 변환해 생성기 슬루
    #   박스의 상/하한으로 쓴다 (현재 185 / 27 kPa abs = +83.7 / −74.3 kPa gauge).
    # ──────────────────────────────────────────
    PositionController:
      # 각도 목표 슬루 [deg/s]. 0 이면 끔(계단 입력).
      #
      # TCP 로 들어온 목표를 계단으로 주면 레퍼런스 생성기가 즉시 큰 힘을 요구하고
      # 액추에이터가 그만큼 세게 튄다. 이 값으로 목표를 램프시키면 압력 레퍼런스도
      # 따라서 완만해진다 — 액추에이터를 보수적으로 움직일 때 여기부터 조인다.
      # 15 deg/s 면 45° 이동에 3 초다.
      # 15 → 25. 사용자 요청 — 각도 레퍼런스 기울기는 더 가팔라도 된다.
      # 부드러움은 이제 아래 kd_vel_ff(D 항 목표속도 피드포워드)가 맡는다.
      target_slew_deg_per_s: 25.0
      # **제어기에 들어가는 오차**의 상한 [deg]. 0 이하면 끔.
      #
      # 예전에는 목표(target_angle_slewed_) 자체를 측정각 ±밴드로 묶었다. 그러면
      # 팔이 멈춘 자리에서 목표까지 같이 얼어붙는다 — 80° 에서 0° 를 명령하면
      # 팔이 14° 에 서고 목표는 9° 에서 멈췄다 (실기 20260829_193558 에서
      # angle − target 이 정확히 +5.00 에 붙어 있었다). 목표는 명령까지 끝까지
      # 가야 한다. 지금은 목표는 그대로 두고 **오차만** 여기서 자른다 — 적분
      # 와인드업과 도달 못 할 큰 수요를 막는 것이 목적이니 그걸로 충분하다.
      target_follow_band_deg: 5.0

      # D 항이 목표 속도를 얼마나 빼고 볼지 (0 = 예전 −kd·vel, 1 = 완전 피드포워드).
      #
      # 예전 −kd·vel 은 **명령한 움직임까지 억제**했다. 목표가 −15 deg/s 로 내려가라
      # 하는데 팔이 그대로 내려가면 D 가 +0.3 N·m 로 붙잡는다. 못 내려가다 중력이
      # 이겨 −45 deg/s 로 미끄러지면 D 가 뒤늦게 +0.9 로 튀어 붙잡는다 — 계단의
      # 정체다. 실기 20260829_193558 하강(t 8~18)에서 목표는 15 deg/s 인데 실제
      # 속도가 −63.8 ~ +14.1 deg/s 로 요동했고 **15% 는 하강 중에 위로 되튀었다**.
      # (vel − 목표속도) 를 쓰면 명령한 속도로 가는 동안은 D 가 0 이고, 벗어난
      # 만큼만 억제한다.
      kd_vel_ff: 1.0

      # 압력 추종 오차가 이보다 크면 **외층 적분을 얼린다** [kPa]. 0 이하면 끔.
      #
      # 외층은 토크를 요구하고 내층(압력 루프)이 그걸 압력으로 만든다. 챔버가
      # 레퍼런스에 한참 못 미치는 동안은 요구가 실현되지 않고 있는 것이므로,
      # 그때 적분을 쌓으면 정의상 와인드업이다. 챔버가 따라잡는 순간 그 적분이
      # 추가 밀어냄이 되어 오버슈트가 된다.
      # 실기 20260829_224219: 계단 직후 챔버가 0.3~1.0 s 정체하는 동안 적분이
      # 0.75 s 만에 상한까지 찼고 오버슛이 19~54% 였다.
      # S-41 에서 8.0 으로 켰다가 밸브 재피팅과 함께 되돌렸다 — 두 변경을 같이
      # 넣어 어느 쪽이 원인인지 못 갈랐다. **20260904 에 이것만 다시 켠다.**
      #
      # 실측 20260904_143712 (axis0, 액추에이터 연결, 상승 계단 4 개):
      #   목표   최대속도   슬루(25dps)대비   챔버정체(P오차>8)   쌓인 적분   오버슛
      #    20°   46.3 dps     1.85 배           2.10 s          0.75(상한)   +8.16°
      #    30°   33.5 dps     1.34 배           0.83 s          0.54         +4.22°
      #    40°   46.0 dps     1.84 배           2.07 s          0.75(상한)   +4.90°
      #    50°   48.3 dps     1.93 배           0.97 s          0.40         +5.84°
      # 20°/40° 계단에서 챔버가 2.1 초 뒤처지는 동안 적분이 **상한까지** 찬다.
      # 20° 에서 중력 토크가 1.01 N·m 이니 적분 0.75 는 그 **75 %** 를 더 미는 것이다.
      # 챔버가 따라잡는 순간 그게 그대로 오버슛이 된다.
      #
      # 8 kPa 문턱은 위 표의 정체 판정에 쓴 값과 같다.
      integ_hold_pressure_err_kpa: 8.0
      axis0:
        # ── 공용 (mode 1 / 2) ──
        mass_kg: 2.0   # 실기: 150 mm 링크에 2 kg 로드
        link_length_m: 0.15   # 0.2→0.15: 실측 링크 150 mm (중력토크 9.81→7.36 N·m)
        p_pos_max_kpa: 185.0  # 양압 정격 [kPa abs]  180→185 (고각도 도달 허용)
        p_neg_min_kpa: 27.0   # 음압 정격 [kPa abs] — 이젝터 한계 실측값
        # 속도 추정 LPF (작을수록 강한 필터, 0 < α ≤ 1).
        #
        # 0.3 → 0.03. 0.3 은 **시뮬레이터 기준 튜닝**이었다. 실기 엔코더의 고주파
        # 잡음은 양자화(0.070°/LSB)가 아니라 그 3 배인 **1σ 0.224°** 다
        # (20260829_165306 정지 구간, 인접 샘플 차분으로 측정). 500 Hz 유한차분이면
        # 각속도 잡음이 ±158 deg/s 이고, α=0.3 을 통과해도 ±66 deg/s 가 남는다.
        # kd=0.04 를 곱하면 **±2.66 N·m** — 2 kg·150 mm 의 중력 최대치(2.94 N·m)의
        # 90% 다. D 항 잡음 하나가 중력 전체와 맞먹는다.
        #
        # ── 제어 500 Hz (dt=2 ms) 시절, 원시 잡음 ±158 dps ──
        #   alpha  τ[ms]   vel잡음    kd·vel    중력 대비
        #    0.30    6.7   ±66 dps   2.66 Nm     91%
        #    0.05   40.0   ±25 dps   1.01 Nm     35%
        #    0.03   66.7   ±20 dps   0.78 Nm     27%   ← 예전 설정
        #
        # 지연 67 ms 는 목표 슬루 15 deg/s 에서 1° 라 무시할 만하다.
        #
        # ── 20260903 제어 200 Hz (dt=5 ms) — 지금 ──
        # 유한차분 간격이 5 ms 라 원시 잡음 ±63 dps.
        #   alpha  τ[ms]   vel잡음    kd·vel    중력 대비
        #    0.075  64.1   ±13 dps   0.50 Nm     17%   ← 지금 (0.073, τ 유지)
        #    0.15   30.8   ±18 dps   0.72 Nm     24%
        #    0.30   14.0   ±27 dps   1.06 Nm     36%
        # 500 Hz 시절 alpha 0.03 이 ±20 dps / 0.78 N·m 였으니, 같은 τ 에서 잡음이
        # 여전히 낮다. 지연을 더 줄이고 싶으면 0.15 (τ 31 ms) 가 다음 후보다 —
        # 그때 잡음 0.72 N·m 도 예전 0.78 보다 낮다. 단 D 항은 루프 이득이니
        # 한 번에 하나만 바꾸고 진동을 볼 것 (S-41/S-42).
        #
        # ── 20260902 제어 100 Hz (dt=10 ms) 전환 ──
        # alpha 는 dt 보정이 없는 고정 계수라 τ = dt/alpha 가 그대로 5 배가 된다.
        # 0.03 을 그냥 두면 τ 가 67 → 333 ms 로 늘어 D 항이 무력해진다.
        # 한편 유한차분 간격이 5 배라 **원시 잡음은 158 → 32 dps 로 떨어진다.**
        #   alpha  τ[ms]   vel잡음    kd·vel    중력 대비
        #    0.30   33.3   ±13 dps   0.53 Nm     18%
        #    0.15   66.7   ± 9 dps   0.36 Nm     12%   ← 지금 (τ 를 그대로 유지)
        #    0.075 133.3   ± 6 dps   0.25 Nm      9%
        #
        # 0.15 는 예전 τ(67 ms)를 그대로 두면서 D 항 잡음만 0.78 → 0.36 N·m 로
        # 절반 넘게 줄인다. **여지가 생겼다**: 0.30 으로 올리면 지연이 67 → 33 ms
        # 로 반이 되는데 그때 잡음(±13 dps, 0.53 N·m)도 예전 0.03 보다 낮다.
        # 지연 문제를 쫓는다면 다음 실기에서 시험해 볼 값이다 — 다만 D 항은 루프
        # 이득이므로 한 번에 하나만 바꾸고 진동을 볼 것 (S-41/S-42 교훈).
        vel_filter_alpha: 0.073
        default_angle_deg: 0.0   # TCP 미연결 시 기본 목표 각도
        actuator_idx: 0    # 엔코더 인덱스 (board17)
        pos_gid: 0         # 양압 채널 (board5)
        neg_gid: 6         # 음압 채널 (board11)

        # ── mode 1 전용 (휴리스틱). control_mode 2 에서는 읽히지 않는다. ──
        mode1:
          kp: 0.8              # 비례 [kPa/deg]   0.6→0.8 (고각도 추종 개선)
          # 적분 [kPa/(deg·s)]  0.15→0.2→1.5→0.3
          # (1.5 는 45° 스텝에서 0.75 초만에 적분 클램프 포화 → 0~100° 리밋사이클 진동,
          #  board17 액추에이터 손상. 20260809 로그 분석)
          ki: 0.3
          kd: 0.05             # 미분(측정값 미분) [kPa·s/deg]
          # 적분 와인드업 방지: 적분항 최대 기여 [kPa]
          # p_pos_max(185) − p_bias_pos(105) − ff_max(29.4@90°) − friction(3) = 47.6 여유 내
          integral_limit_kpa: 45.0
          # 중력 FF 환산: P_ff = kff_gravity × m·g·L·sin(angle) [kPa]
          # 물리적으로 맞는 값은 1/(A·reel)/1000 = 20.4 kPa/(N·m) 이고, 아래 3.0 은
          # 그 1/6.8 이라 mode 1 은 90°에서 중력의 29% 만 보상한다.
          # (mode 2 는 중력 FF 를 토크 N·m 로 직접 쓰므로 이 환산이 아예 불필요하다)
          kff_gravity: 3.0
          friction_kpa: 3.0    # 쿨롱 마찰 보상 [kPa]   2.0→3.0 (5kg 마찰 증가)
          p_bias_pos_kpa: 105.0   # 양압 평형점 [kPa abs]
          p_bias_neg_kpa: 90.0    # 음압 평형점 [kPa abs] (대기압 이하 = 진공)
          # 음압 커플링: P_neg = p_bias_neg − delta × neg_coupling
          # 0 = 음압 고정, 1 = 완전 차동. delta=64(실측 최대) → 90−64 = 26 → clamp 27
          neg_coupling: 1.0
          p_pos_min_kpa: 101.325  # 양압 하한 (대기압)
          p_neg_max_kpa: 101.325  # 음압 상한 (대기압)
          # 압력 레퍼런스 슬루레이트 [kPa/s] — 목표압력 점프 방지
          # (20260818: 각도명령 변경 시 목표압력이 즉시 뛰며 190 kPa 안전한계에서 릴레이 진동)
          ref_slew_kpa_per_s: 3.0

      axis1:
        # 공용 — enc/pos/neg = board18 / board6  / board12
        # 2 축 동시 구동 준비 (20260829). **axis0 과 같은 리그로 가정했다** —
