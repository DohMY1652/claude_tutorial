    LinePID:
      pos:
        kp: 0.18              # 0.5→0.2→0.08→0.12→0.18: 100~120대 리플 지속 → 목표(155) 근접 위해 추가 상향 (20260818)
        # ki 0.0 → 0.3: 이 밸브는 '대기 방출(릴리프)' 이므로 셋포인트를 유지하려면
        # 정상상태에서 거의 닫혀 있어야 하고, 그건 u≈100 을 뜻한다. 비례항만으로
        # u=100 을 만들려면 e≈555 kPa 가 필요해 구조적으로 도달할 수 없었다.
        # (시뮬 확인: P⁺ 161.6 → 101.8 kPa, 목표 155 미달. 반면 ki 가 있는 음압은 수렴.)
        # control_mode 2 의 적응 레일 셋포인트는 이 적분항이 있어야 의미가 있다.
        ki: 0.3
        kd: 0.05              # 0.0→0.02→0.03→0.05: 감쇠 추가 강화로 리플 억제
        ref: 155.0      # 400→155: 목표압력 범위(105~134 kPa)에 맞춰 라인압-목표압 차이를 줄여 소개도 구간 과잉유입/릴레이 진동 억제 (20260818)
        pwm_index: 0    # (board 1 - 1)*3 + 0 = 0

      neg:
        kp: 0.8               # 2.0→0.8: 위와 동일한 사유로 하향
        # ki 0.04 → 0.5: 양압과 **같은 구조 문제**였다. board2 v1 은 '대기 유입'
        # 밸브라 진공을 유지하려면 정상상태에 u≈100 이 필요한데, ki=0.04 로는
        # 유입 밸브를 닫는 데 289 s 가 걸려 음압 레일이 27 셋포인트에 도달하지
        # 못하고 35 kPa 에 멈췄다. 그러면 음압 챔버가 레일 아래로 못 가고
        # 토크가 7.4 N·m 에 묶여 70° 명령이 67° 에서 정지했다.
        # 0.5 로 올리자 레일이 27.0 에 도달하고 70° 오차가 3.2° → 0.06° 가 됐다.
        ki: 0.5              # 0.2→0.04
        kd: 0.01              # 0.0→0.01
        ref: 30.0         # 50→30: 강한 진공 라인 공급
        pwm_index: 3    # (board 2 - 1)*3 + 0 = 3

      out_min: 0.0
      out_max: 100.0

    MPC_parameters:
      NP: 10
      n_x: 1
      n_u: 3
      Ts: 0.004
      Q_values: 10.0
      R_values: 10.0

      # 계획 지평은 제어 주기와 **독립**이다. ≤0 이면 위 NP / Ts 를 쓴다 (10 × 4 ms = 40 ms).
      # **늘리지 말 것.** 롤아웃이 레일압과 V̇ 를 지평 내내 상수로 두므로 40 ms 를 넘으면
      # 그 가정이 깨져 모델 오차가 결정을 지배한다. 계측(IAE): 40 ms 19.5 → 80 ms 33.3
      # → 120 ms 42.7. 즉 모델 유효 창이 약 40 ms 다. 늘리려면 레일 동역학과 액추에이터
      # 운동을 먼저 롤아웃에 넣어야 한다 (MPPI.md 8절).
      mppi_np: -1
      mppi_ts_s: -1.0

      # ══════════════════════════════════════════════════════════════════════
      # 솔버 선택:  qp | mppi
      #
      #   qp   — 기존 경로. 13-parameter 밸브 모델을 수치 야코비안으로 선형화해
      #          (A_scalar, B_row) 를 만들고 Δu 응축 QP 를 qpOASES 로 푼다.
      #   mppi — 선형화 없음. 같은 모델을 그대로 K 개 롤아웃하고 exp(−J/λ) 가중
      #          평균한다 (Model Predictive Path Integral). 상세: include/Mppi.hpp
      #
      # 왜 바꾸는가 — qp 경로에는 구조적 결함이 두 개 있다:
      #   1) 초킹 구간에서 A_scalar 가 **정확히 0** 이다 (초킹 유량은 하류압과 무관 →
      #      dQ/dPout = 0). 그러면 T_bar = 0 이 되어 목적함수가 (P_ref − P_now) 가 아니라
      #      절대압 Xref 를 추종하려 한다. 동작점 대부분이 초킹이라 상시 조건이다.
      #   2) A_scalar 는 연속시간 야코비안 ∂Ṗ/∂P [1/s] 인데 이산 전이행렬로 쓰여
      #      A¹..A^NP 가 만들어진다 (1 + A·Ts 여야 한다).
      # 게다가 이 플랜트의 지배적 비선형성 — 크래킹 임계(계단), 초킹, 명령 테이퍼,
      # 그리고 **지평(40 ms)과 같은 스케일인 밸브 2차 동특성(τ≈25 ms)** — 은 선형화로
      # 표현되지 않는다. qp 경로는 밸브 동특성을 아예 무시했다.
      #
      # 두 경로를 모두 남긴 이유: 이 하네스는 비결정론적이다(0절). 같은 빌드에서
      # 이 값만 바꿔 A/B 비교해야 판정이 가능하다.
      #   mppi_system — **전체 시스템 중앙집중.** 12채널 + 라인 밸브 2개를 한 번에 푼다.
      #     채널별 MPPI 는 공유 레일을 지평 동안 상수로 두는데, 실제로는 채널 1개 개방에
      #     ≈5 kPa, 양압 6채널 동시에 ≈34 kPa 강하한다 (추종 기준 10 kPa 대비 0.5~3.4σ).
      #     레일 부피 500 mL 는 그 레일이 먹여 살리는 챔버 6개 합(300 mL)의 1.67배뿐이고,
      #     채널 1개 완전개방 유량이 펌프 전체 토출의 5배다. 게다가 "채널 수요 합 vs
      #     레일 공급" 을 비교하는 코드가 어디에도 없었다 — 12 제어기가 서로를 모른 채
      #     같은 500 mL 를 각자 무한 소스로 가정했다. 전체를 한 모델에 넣으면 그 결합이
      #     자동으로 들어오고 라인 PID 도 흡수된다 (양압 PID 는 방출 밸브밖에 없어
      #     레일압을 올릴 수단이 없고 정상상태에 이미 포화해 있다).
      #     비용: 같은 K 에서 총 계산량 1.24배. 병렬화 축을 채널 12개 → 표본 K개 로
      #     바꾸면 24스레드에서 K=512 가 0.76 ms (틱 2 ms) 다.
      solver: mppi

      # ── 중앙집중(mppi_system) 전용 ─────────────────────────────────────────
      # 표본 수. 제어 차원이 26 × NP 로 커지므로 채널별(3 × NP)보다 넉넉히 준다.
      # 계측 근거: 채널별에서 K 64→192 무차이였으므로 그쪽은 과표본이었다.
      # 128: 256 보다 측정상 더 좋았다 (IAE 13.5 vs 17.8) 그리고 싸다. 제어 차원이
      # 26×NP 로 커지지만 표본을 늘려 얻는 것이 없었다 — 한계는 표본 수가 아니라
      # 공유 롤아웃의 공로 배분이다 (MPPI.md 10.4).
      sys_samples: 128

      # 실시간 데드라인 [us]. 한 번의 solve 가 이걸 넘기면 다음 틱들을 건너뛰고
      # Δu=0(순수 피드포워드)로 간다. 중앙집중 솔버는 평균은 예산 안이지만 산발적으로
      # 5~8배 스파이크가 난다 — 제어 루프가 멈추는 것보다 한 틱 쉬는 게 낫다.
      # 계측: 기본값에서 초과 49회 / 건너뜀 75틱 (전체의 0.75%).
      # 비우면 틱의 60% 가 기본이다.
      sys_deadline_us: 1200.0
      # 레일이 셋포인트를 벗어나는 것에 대한 가중. 챔버 추종(w_track=1.0)보다 낮게 둔다 —
      # 레일은 과도 구간에 내려가는 것이 정상이고, 그것을 막으려 채널을 닫으면 본말전도다.
      sys_w_rail: 0.5
      sys_rail_scale_kpa: 20.0
      # 레일 부피·누설. **실측 필요** — RUNBOOK.md 의 펌프 피팅 Phase L 이 정확히 이 값을
      # 이중 부피법으로 구한다. 지금은 시뮬 기본값이다.
      rail_volume_pos_ml: 500.0
      rail_volume_neg_ml: 500.0
      rail_leak_pos: 0.002
      rail_leak_neg: 0.002

      # ── 상태 관측기 (mppi / mppi_system 공용) ──────────────────────────────
      # 측정 경로에 LPF 가 직렬 2단(각 τ≈9 ms) 걸려 있어 필터값은 ≈18 ms 늦다 —
      # 지평 40 ms 의 45% 다. 생값은 즉각이지만 양자화 잡음(0.25 kPa/LSB)이 그대로다.
      # 모델로 앞서 예측하고 그 예측에 **같은 LPF 2단을 복제**해 측정과 같은 조건으로
      # 비교한 뒤 잔차로 보정하면 둘을 동시에 얻는다.
      #
      # 계측(스텝 4개 평균): 켜면 정착 1.22→1.08 s, 정상상태 압력오차 0.25→0.00 kPa 로
      # 좋아지고 IAE 는 5.30→5.78 로 약간 나빠졌다. 다만 **평가 지표가 개선을 다 볼 수
      # 없다** — pRMSE 를 필터된 측정값으로 재므로 진짜 압력이 좋아져도 반영이 덜 된다.
      # 그래서 기본 OFF 로 두고, 실기에서 잡음 특성이 다를 때 다시 판단한다.
      # 적분항을 없애는(offset-free) 다음 단계의 전제이기도 하다.
      mppi_estimator: false
      obs_gain: 0.10           # 잔차 보정 이득 [1/tick]. 0.15 부근이 최선이었다
      obs_bridge_alpha: 0.2    # 브리지/시뮬 LPF 계수 (컨트롤러가 직접 모르는 값)

      # 진단용: 롤아웃 초기 상태로 필터 전 생값을 쓴다. 압력 RMSE 는 좋아지지만
      # 위치는 나빠진다 (잡음을 쫓는다) — 관측기가 그것을 대체한다.
      mppi_raw_state: false

      # ── 레일 결합: 채널 롤아웃에 레일 변화율을 주입 ────────────────────────
      # 12채널의 **명목 명령**으로 레일 질량수지를 한 번 계산해 dP_rail/dt 를 내고,
      # 롤아웃이 레일을 상수가 아니라 그 기울기로 이동시킨다. 물리적으로 더 정확하다
      # (상수 가정의 오차는 채널 1개 ≈5 kPa, 6채널 동시 ≈34 kPa).
      #
      # **그런데 측정상 중립~약간 나쁘다** (IAE 5.32 → 5.62, pRMSE 5.63 → 6.01).
      # 이유: PressureRefGen 의 슬루 박스가 이미 **측정된 레일압으로 도달 가능한 ΔP** 를
      # 계산해 레퍼런스를 제한한다. 즉 레퍼런스가 애초에 레일이 못 주는 것을 요구하지
      # 않으므로 예측 정확도를 높여 살 것이 없다. 슬루 박스가 존재하는 이유가 이것이다.
      #
      # 기본 OFF. 실기에서는 슬루 박스가 ≈18 ms 늦은 측정 레일압을 쓰므로 상황이
      # 다를 수 있어 스위치는 남겨 둔다.
      mppi_rail_rate: false

      # ── 중앙집중이 라인 밸브까지 소유할지 (mppi_system 전용) ───────────────
      # true 로 하면 라인 PID 를 흡수한다. **계측 결과 불안정했다**: 양압 레일이
      # 74↔800 kPa 를 오가고 음압이 대기압(101)을 넘는 107 까지 갔다 (라인 PID 는
      # 222/100, 28/74). 레일 동역학이 채널 하나에 2479 kPa/s 로 매우 빠른데 2 ms 마다
      # 재계획하니 뱅뱅 동작이 된다. false 면 레일은 **예측만** 하고 제어는 PID 에 맡긴다.
      sys_control_lines: false
      # 레일 비용을 각 채널에 배분하는 비율 (공유 가격). control_lines=false 면 무의미.
      sys_rail_share: 0.20

      # ── MPPI 하이퍼파라미터 ───────────────────────────────────────────────
      # 샘플 수. 채널 12개가 32코어에서 완전 병렬로 돌고 틱 예산이 2 ms 이므로
      # 넉넉하다. 기동 로그의 "MPPI: N us 평균 / M us 최대" 로 실제 예산을 확인하고
      # 올리거나 내릴 것 — 최대가 2000 us 에 근접하면 줄여야 한다.
      mppi_samples: 128

      # λ — **비용 산포에 대한 비율**이다: λ_eff = λ·(Jmax − Jmin).
      # 절대 λ 를 쓰지 않는 이유: 비용 스케일이 오차 크기·챔버 부피·레일압에 따라
      # 통째로 변해 매 동작점마다 재튜닝해야 하고, 틀리면 가중치가 한 샘플로 붕괴하거나
      # (탐색 소멸) 균일해진다(선택 소멸). 산포 기준이면 스케일에 불변이다.
      # 진단: 로그의 "유효샘플 x/K" 가 1 에 붙으면 붕괴(λ 를 올린다), K 에 붙으면
      # 균일 평균(λ 를 내린다). 대략 K 의 10~50% 가 건강한 범위다.
      mppi_lambda: 0.15

      # ── 탐색 분산: 크래킹 임계를 넘을 수 있어야 한다 ─────────────────────
      # 이 밸브는 ≈52%(상류압 의존) 아래에서 유량이 정확히 0 이다. 정상상태에서 uref≈0
      # 인데 표준편차가 작으면 **모든 샘플이 임계 아래**라 궤적이 전부 같고 비용도 같아진다.
      # 그러면 선택이 사라져 명목 시퀀스가 무작위 보행으로 박스 끝에 박히고, 거기서
      # uref 가 커지는 순간 밸브를 세게 연다 (계측: 첫스텝 포화 99.9%, 오버슈트 11.5°).
      # → 혼합 분포를 쓴다: 대부분은 작은 sigma 로 정밀하게, explore_frac 만큼은 큰
      #   sigma 로 임계를 건너뛴다. 데드밴드 플랜트에서 단일 분산으로는 정밀도와
      #   도달성을 동시에 얻을 수 없다.
      mppi_sigma_pct: 1.5            # 정밀 탐색
      mppi_sigma_explore_pct: 5.0   # 임계 돌파용
      mppi_explore_frac: 0.30        # 큰 sigma 를 쓰는 샘플 비율

      # MPPI 의 Δu 한계 [%]. QP 경로의 ±30 을 쓰지 않는 이유가 위와 같다 — uref≈0 에서
      # ±30 이면 크래킹 임계(≈52%)에 도달조차 못 한다. 100 이면 절대 클램프 [0,100] 과
      # 겹쳐 사실상 전권이다.
      mppi_du_limit_pct: 8.0

      # ── 지평 안 스테이지 레퍼런스의 접근 시상수 [s] ──────────────────────
      # **이 값이 성능을 가장 크게 좌우한다.** ≤0 이면 target_time_constant 를 쓴다.
      #
      # 지평 전체를 P_ref 상수로 두면 "40 ms 안에 전 오차를 닫아라" 가 된다. 그런데
      # P_ref 는 생성기가 슬루 제한해 만든 궤적의 현재 점이고, 챔버 50 mL 에 밸브를 열면
      # 4 ms 에 99 kPa 가 움직이므로 MPPI 는 실제로 닫을 수 있다 — 그래서 최대 공격성으로
      # 밀고 위치가 오버슈트한다 (계측: 오버슈트 4.7~8.7°, 정착 실패).
      # 대신 지평 안에서 1차로 접근하는 궤적을 기준으로 주면 MPPI 가 "경쟁하는 공격적
      # 제어기" 가 아니라 "그 궤적에서 모델 오차를 메우는 보정기" 가 된다.
      #
      # scripts/ctrl_eval.py 다단 프로파일(스텝 4개 평균) 계측. 상세 표는 MPPI.md 6.3.
      #   tau      IAE     오버슈트[°]  정착[s]   pRMSE[kPa]
      #   0.04    17.67      8.91       2.21      23.08
      #   0.06     6.14 / 12.34 ← **같은 설정 재실행에서 결과가 갈린다. 안정 한계다.**
      #   0.09     5.61       2.33       1.22       7.90   (재현성이 0.12 보다 나쁘다)
      #   0.12     6.01       1.86       1.02       5.70   ← 채택
      #   0.16     6.93       2.11       1.45       5.53
      #   0.30    19.49       1.68       2.73      12.50
      mppi_ref_tau_s: 0.12

      # 노이즈 1차 상관 β. 독립 노이즈는 250 Hz 성분이라 τ≈25 ms 밸브가 통과시키지
      # 못해 탐색이 그냥 낭비된다 → ε_k = β·ε_{k−1} + √(1−β²)·n_k 로 저역에 힘을 준다.
      mppi_noise_beta: 0.70

      # 비용 가중. 음수면 위 Q_values / R_values 를 그대로 쓴다.
      # 단 단위 의미가 다르다 — QP 는 원 단위(kPa², %²), MPPI 는 정규화 오차²·이탈²
      # 이므로 절대 크기가 아니라 **비율**만 이어진다.
      mppi_w_track: 1.0        # 추종 (오차/기준)²
      mppi_w_effort: 0.10      # uref 로부터의 이탈 (Δu/100)²
      mppi_w_du: 0.05          # 스텝 간 변화율² — 채터 억제
      mppi_track_scale_kpa: 10.0   # 오차 정규화 기준 [kPa]
      mppi_terminal_mult: 0.0      # 말단 상태 가중 배수 — 0 이 최선이었다 (MPPI.md 6.3)

      # 스텝당 오일러 서브스텝. 밸브가 완전 개방일 때 dP/dt 가 커서 Ts=4 ms 단일
      # 스텝이 거칠 수 있다. 2 면 2 ms 로 시뮬(sim_substeps)과 비슷한 해상도가 된다.
      #
      # 실시간 예산: substeps=2 에서 523~560 us 평균 / 1065 us 최대 (틱 2000 us).
      #              substeps=1 은 310 us / 649 us 로 절반이고, 측정된 품질 차이는
      #              런 간 분산 안이었다. 기동 로그의 "MPPI: N us 평균 / M us 최대" 가
      #              예산을 압박하면 여기를 1 로 내리는 것이 첫 번째 수단이다.
      mppi_substeps: 1

      # ══════════════════════════════════════════════════════════════════════

      ejector_k: 0.005
      ejector_p_limit: 11.325

      leakage_u_pos: 0.0
      leakage_u_neg: 0.0

      # 0.5: MPC 가 레퍼런스에 접근하는 목표 시상수 [s].
      # 8.0 은 릴레이 진동 진단용 실험값이 남은 것이었고, 6축 정착시간을 지배했다.
      #   8.0 → 17.1 s,  2.0 → 8.1 s,  0.5 → 3.2 s  (정확도는 모두 동일)
      # 0.2/0.1 로 더 줄여도 정착은 3.0/2.5 s 로 소폭 빨라지는 대신 오버슈트가
      # 2.5° → 3.4° 로 커져 0.5 를 택했다.
      target_time_constant: 0.5

      # macro(탱크 부스트 / 이젝터) 개방 임계값은 **없다.** 내층이 매 틱
      #     q_rail  = min(요구, 레일 밸브가 100%에서 낼 수 있는 유량)
      #     q_boost = max(0, 요구 − 레일 최대)
      # 로 나누므로, 레일이 감당하면 q_boost=0 이라 macro 가 저절로 닫힌다.
      # (구 macro_threshold / macro_micro_sat_pct / macro_gate_frac 을 모두 대체.
      #  MATLAB pressure_reference_optimizer.m 의 update_sources 와 같은 규칙이다.)

      # ── 밸브 크래킹 임계 ────────────────────────────────────────────────
      # 이 비례밸브는 솔레노이드 자기력이 스프링/압력을 이겨 스풀을 들어올려야 흐른다.
      # 그 전류(크래킹 임계) 아래에서는 유량이 0 이고, 실측상 약 50% 였다. 상류 압력이
      # 스풀을 밀어 올려 돕기 때문에 임계는 압력에 따라 변한다.
      #
      # 13-variable 모델이 이걸 이미 재현한다 (C_p·Pin 항 + alpha_shape=3884):
      #   Pin[kPa abs]  110    155    250    351    700
      #   크래킹  u[%]  62.0   60.2   56.4   52.3   38.4
      # mode 2 의 양압레일 SP 는 250 kPa gauge = 351 kPa abs 이므로 ≈52% — 실측과 일치.
      #
      # 이 값은 "닫힘으로 볼 유효면적 비율"(A_eff/A_max)이고, 위 표는 1e-6 기준이다.
      # 실측 크래킹 전류를 알면 그 압력에서 값이 맞도록 여기를 교정하면 된다.
      valve_crack_area_frac : 0.01
      # 1e-6 이면 시그모이드 바닥이라 실제 유량이 시작되는 지점보다 한참 아래를
      # 가리킨다 (배기 기준 112 mA, 실측 크래킹은 138 mA). 0.05 로 두면 A_max 의
      # 1% 지점이 되고 그것이 실측 크래킹과 맞는다 (배기 134 mA 에서 −1.9 kPa/s). 이 값이 "유량을 요구하면
      # 최소한 여기까지는 연다" 의 기준이다 (Controller.cpp open_at_least).
      # 이때 최소 유량은 충전 ≈14.5 kPa/s, 배기 ≈1.9 kPa/s 다.
      # 0.05 로 두면 충전 최소가 72 kPa/s 가 되어 한 번 열 때마다 6 kPa 씩
      # 밀어 올려 ±3 kPa 리밋사이클이 된다 — 최소 스텝이 곧 정착 정밀도다.

      # ── 명령 저역통과 [Hz] (0 = 끔) ────────────────────────────────────
      # 밸브는 2차계이고 실측 피팅이 ωn 39.5~45.3 rad/s(6.3~7.2 Hz), ζ≈0.2 를 준다.
      # ζ=0.2 는 공진 첨두가 1/(2ζ)=2.5배인 매우 약한 감쇠다. 그런데 MPPI 는
      # du_limit=100 이라 한 틱(2 ms)에 u 를 0↔100 로 던질 수 있어, 250 Hz 성분까지
      # 실린 명령이 7 Hz 공진을 정면으로 때린다.
      #   실기 계측(18:30): 챔버가 6.86 Hz 로 peak-to-peak 210 kPa 진동. 그 주파수가
      #   밸브 고유주파수와 정확히 일치했고 첫스텝 포화가 97.6~100% 였다.
      # 2.0 Hz 로 자르면 7 Hz 성분이 1/√(1+(7/2)²) = 0.27 배로 줄고, 제어 대역
      # (mppi_ref_tau_s 0.12 s → 1.33 Hz)에서의 위상 지연은 34° 로 감당 가능하다.
      # 과압 세이프티는 cmds_ 를 직접 덮어쓰므로 이 필터를 지나지 않는다 (배기 안 느려짐).
      cmd_lpf_hz : 2.0

      # 적분 기여분 상한 [지령 %p]. 이 밸브는 비례대역이 5.2%p 뿐이고 크래킹
      # 아래에서 유량이 정확히 0 이라, 적분기가 반응 없이 쌓이다 밸브가 열리는
      # 순간 718 kPa/s 로 덤핑한다. 적분기의 역할은 모델이 빗나간 만큼(≈8%p) 을
      # 메우는 것뿐이므로 그만큼만 허용한다.
      ki_u_limit_pct : 15.0

      # 크래킹 하한은 |dP/dt| 가 이보다 작을 때만 건다 [kPa/s].
      # 하한의 목적은 "유량을 요구했는데 아무 일도 안 일어난다" 를 구제하는 것이다.
      # 조건 없이 걸면 반대로 문제가 된다 — 모델은 크래킹 지점 최소 유량을
      # 14.5 kPa/s 로 보지만 실기 충전 밸브는 그 지점에서 285~495 kPa/s 를 낸다.
      # 압력이 조금만 내려가도 밸브를 확 열어 3 Hz 리밋사이클(p-p 14~30 kPa)이 됐다.
      crack_floor_rate_kpas : 5.0

      # 명령 테이퍼(구 cmd_taper_kpa)는 제거했다. 사람이 정하는 kPa 임계값이었고,
      # 플랜트에서는 꺼져 있는데 MPPI 롤아웃에는 남아 있어 예측이 실제보다 감쇠돼
      # MPPI 가 그만큼 더 세게 밀었다. 이제 양쪽 모두 clamp(uref+du, 0, 100) 이다.
      # 크래킹 임계 아래에서 유량이 0 인 것은 13-parameter 모델이 이미 표현한다.


    pressure_safety_limit_kpa: 190.0        # 170→190: p_pos_max=180 이므로 여유 확보
    pressure_safety_hysteresis_kpa: 15.0   # 10→15: safety 해제 기준 = 190-15 = 175 kPa

    default_volume_ml: 1.0

    system_parameters:
      valve_operate: true

    MacroSwitch:
      pwm_index: 9    # (board 4 - 1)*3 + 0 = 9

