        # 엔코더를 새로 달면 EncoderCalibration 의 raw_0deg/raw_90deg 만 고칠 것.

    channel_config:
      ch0:
        pos_ki_micro: 0.35
        pos_ki_macro: 0.05
        pos_ki_atm: 0.60
        k0: 0.00022
        k1: 0.010
        k2: 0.75
      ch1:   # = 1 / 4.97 (실측 이득비)
        pos_ki_micro: 0.35
        pos_ki_macro: 0.05
        pos_ki_atm: 0.60
        k0: 0.00022
