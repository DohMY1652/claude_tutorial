          p_neg_max_kpa: 101.325
          ref_slew_kpa_per_s: 3.0

      axis3:
        # 공용 — enc/pos/neg = board20 / board8  / board14
        mass_kg: 5.0
        link_length_m: 0.15
        p_pos_max_kpa: 185.0
        p_neg_min_kpa: 27.0
        vel_filter_alpha: 0.3
        default_angle_deg: 0.0
        actuator_idx: 3
        pos_gid: 3
        neg_gid: 9
        # mode 1 전용
        mode1:
          kp: 0.8
          ki: 0.3
          kd: 0.05
          integral_limit_kpa: 45.0
          kff_gravity: 3.0
          friction_kpa: 3.0
          p_bias_pos_kpa: 105.0
          p_bias_neg_kpa: 90.0
          neg_coupling: 1.0
          p_pos_min_kpa: 101.325
          p_neg_max_kpa: 101.325
          ref_slew_kpa_per_s: 3.0

      axis4:
        # 공용 — enc/pos/neg = board21 / board9  / board15
        mass_kg: 5.0
        link_length_m: 0.15
        p_pos_max_kpa: 185.0
        p_neg_min_kpa: 27.0
        vel_filter_alpha: 0.3
        default_angle_deg: 0.0
